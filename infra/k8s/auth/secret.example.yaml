# ==========================================================================
# EXEMPLO / TEMPLATE de Secret. NAO comite este arquivo com valores reais.
# Copie para secret.yaml, troque os valores REPLACE_ME e aplique;
# OU (recomendado) crie via `kubectl create secret` como no RUNBOOK.
#
# stringData: voce escreve TEXTO PURO aqui. O Kubernetes converte para
# base64 sozinho ao salvar. Nao precisa rodar `base64` na mao.
# ==========================================================================
apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
  namespace: auth
type: Opaque
stringData:
  # endpoint do RDS toggle-auth (porta 5432, banco auth_db)
  DATABASE_URL: "postgresql://postgres:REPLACE_ME_AUTH_DB_PASS@REPLACE_ME_AUTH_ENDPOINT:5432/auth_db?sslmode=require"
  # chave mestra usada para criar API keys no endpoint /admin/keys
  MASTER_KEY: "REPLACE_ME_MASTER_KEY"
