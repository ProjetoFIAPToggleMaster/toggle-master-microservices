# HPA do analytics-service por CPU media.
# Quando a fila SQS enche, o worker processa mais mensagens, a CPU sobe
# e o HPA adiciona replicas (workaround por CPU, conforme o desafio).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: analytics-hpa
  namespace: analytics
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: analytics-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
