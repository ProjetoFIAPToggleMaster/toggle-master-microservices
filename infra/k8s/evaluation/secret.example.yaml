# Template. Veja explicacao no auth/secret.example.yaml e no RUNBOOK.
# ATENCAO: SERVICE_API_KEY nao existe ainda no inicio -> ela e GERADA pelo
# auth-service em runtime (passo de bootstrap no RUNBOOK). Deixe o placeholder
# e atualize a secret depois de gerar a chave.
apiVersion: v1
kind: Secret
metadata:
  name: evaluation-secret
  namespace: evaluation
type: Opaque
stringData:
  # endpoint do ElastiCache (porta 6379, sem TLS/senha)
  REDIS_URL: "redis://REPLACE_ME_REDIS_ENDPOINT:6379"
  # URL da fila SQS toggle-evaluations
  AWS_SQS_URL: "https://sqs.us-east-1.amazonaws.com/REPLACE_ME_ACCOUNT_ID/toggle-evaluations"
  # chave gerada pelo auth /admin/keys (preencher DEPOIS do bootstrap)
  SERVICE_API_KEY: "REPLACE_ME_AFTER_BOOTSTRAP"
