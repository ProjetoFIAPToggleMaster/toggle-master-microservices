# Replace <ACCOUNT_ID> and <REGION> with your real values before deploying
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: toggle-master
spec:
  template:
    spec:
      containers:
        - name: auth-service
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/auth-service:latest

