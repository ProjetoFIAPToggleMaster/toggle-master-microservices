# ---------------------------------------------------------------------------
# ServiceAccounts com IRSA (IAM Roles for Service Accounts)
# ---------------------------------------------------------------------------
# A anotação eks.amazonaws.com/role-arn faz o EKS injetar no pod um token
# OIDC de curta duração, que o boto3 / AWS SDK troca automaticamente por
# credenciais temporárias da role indicada.
#
# Resultado: nenhum AWS_ACCESS_KEY_ID ou AWS_SECRET_ACCESS_KEY precisa
# existir em Secret nenhum. As credenciais são temporárias e rotacionadas
# pela própria AWS — é a resposta direta à reclamação do desafio sobre
# "credenciais passadas em arquivos de texto sem segurança".
#
# As roles são criadas pelo Terraform (aws_iam_role.irsa). Confira os ARNs
# reais com:
#   terraform -chdir=terraform output irsa_role_arns
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evaluation-service
  namespace: toggle-master
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::567627323809:role/toggle-master-prod-evaluation-service

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-service
  namespace: toggle-master
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::567627323809:role/toggle-master-prod-analytics-service
