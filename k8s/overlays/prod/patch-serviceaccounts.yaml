# ---------------------------------------------------------------------------
# Liga cada Deployment ao seu ServiceAccount com IRSA
# ---------------------------------------------------------------------------
# Sem serviceAccountName, o pod usa o ServiceAccount "default" do namespace,
# que não tem anotação de role — e aí o SDK cairia na role do node (permissão
# ampla demais) ou simplesmente não encontraria credencial alguma.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: toggle-master
spec:
  template:
    spec:
      serviceAccountName: evaluation-service

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: toggle-master
spec:
  template:
    spec:
      serviceAccountName: analytics-service
