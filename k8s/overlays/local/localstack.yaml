apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: toggle-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3.8.0
          env:
            - name: SERVICES
              value: "sqs,dynamodb"
          ports:
            - containerPort: 4566
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: toggle-master
spec:
  selector:
    app: localstack
  ports:
    - port: 4566
      targetPort: 4566
  type: ClusterIP
