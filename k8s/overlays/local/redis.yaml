apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-evaluation
  namespace: toggle-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-evaluation
  template:
    metadata:
      labels:
        app: redis-evaluation
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: redis-evaluation
  namespace: toggle-master
spec:
  selector:
    app: redis-evaluation
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
