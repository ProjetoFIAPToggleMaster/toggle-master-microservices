# Peças próprias da stack de monitoramento (Application monitoring-extras).
# Sem "namespace:" global: o RBAC do self-healer vive no namespace toggle-master.
# Cada manifest declara o próprio namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - dashboard-togglemaster.yaml
  - alerting.yaml
  - self-healer.yaml
