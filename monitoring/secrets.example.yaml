# ---------------------------------------------------------------------------
# Template dos secrets da stack de monitoramento
# ---------------------------------------------------------------------------
# Copie para monitoring/secrets.yaml (ignorado pelo Git), preencha e aplique:
#   kubectl create namespace monitoring
#   kubectl apply -f monitoring/secrets.yaml
#
# NUNCA versione o arquivo preenchido.
# ---------------------------------------------------------------------------

# Fase 2/3 — chave do Datadog usada pelo OTel Collector (exporter datadog).
apiVersion: v1
kind: Secret
metadata:
  name: datadog-secret
  namespace: monitoring
type: Opaque
stringData:
  DD_API_KEY: "<api key do Datadog>"
  # Site da conta: datadoghq.com, us3.datadoghq.com, us5.datadoghq.com, datadoghq.eu ...
  DD_SITE: "datadoghq.com"
---
# Fase 4 — destinos dos alertas do Grafana.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-alerting-secrets
  namespace: monitoring
type: Opaque
stringData:
  # Jira Service Management Operations (sucessor do OpsGenie):
  #   Operations -> Integrations -> Add integration -> "API" -> copie a API key
  OPSGENIE_API_KEY: "<api key da integração do JSM>"
  # URL da API de alertas (compatível com OpsGenie):
  #   JSM (padrão):    https://api.atlassian.com/jsm/ops/integration/v2/alerts
  #   OpsGenie legado: https://api.opsgenie.com/v2/alerts
  #   Conta na região EU do OpsGenie: https://api.eu.opsgenie.com/v2/alerts
  OPSGENIE_API_URL: "https://api.atlassian.com/jsm/ops/integration/v2/alerts"
  # Discord: Canal -> Editar -> Integrações -> Webhooks -> Copiar URL
  DISCORD_WEBHOOK_URL: "<https://discord.com/api/webhooks/...>"
  # Token compartilhado entre o Grafana e o self-healer (auto-remediação).
  # Gere com: openssl rand -hex 32
  SELF_HEALER_TOKEN: "<token aleatório>"
---
# Fase 4 — credenciais do self-healer para abrir incidentes no JSM (REST API).
# Separado do grafana-alerting-secrets: o Grafana não precisa deste token.
#
# API token: https://id.atlassian.com/manage-profile/security/api-tokens
# (o token herda as permissões do usuário: ele precisa poder abrir requests
# no service project.)
#
# Ids para JIRA_SERVICE_DESK_ID / JIRA_REQUEST_TYPE_ID (env do Deployment em
# monitoring/manifests/self-healer.yaml):
#   curl -su "$JIRA_EMAIL:$JIRA_API_TOKEN" \
#     https://toggle-master.atlassian.net/rest/servicedeskapi/servicedesk
#   curl -su "$JIRA_EMAIL:$JIRA_API_TOKEN" \
#     https://toggle-master.atlassian.net/rest/servicedeskapi/servicedesk/<id>/requesttype
apiVersion: v1
kind: Secret
metadata:
  name: self-healer-secrets
  namespace: monitoring
type: Opaque
stringData:
  JIRA_EMAIL: "<email da conta Atlassian>"
  JIRA_API_TOKEN: "<api token Atlassian>"
