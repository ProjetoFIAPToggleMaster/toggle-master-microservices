# ArgoCD Application — Loki (logs centralizados)
#
# Mesmo padrão multi-source do kube-prometheus-stack.yaml:
# chart oficial + valores versionados neste repositório.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-loki
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.6.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/monitoring/values/loki.yaml
    - repoURL: https://github.com/ProjetoFIAPToggleMaster/toggle-master-microservices.git
      targetRevision: master
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
