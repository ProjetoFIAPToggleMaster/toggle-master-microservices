name: evaluation-service CI/CD

on:
  pull_request:
    paths:
      - 'evaluation-service/**'
      - '.github/workflows/evaluation-service-ci.yml'
  push:
    branches: [main]
    paths:
      - 'evaluation-service/**'
      - '.github/workflows/evaluation-service-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: evaluation-service

env:
  SERVICE_NAME: evaluation-service
  GO_VERSION: '1.21'

jobs:
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Run unit tests
        run: go test ./... -v

  lint:
    name: Linter / Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: evaluation-service
          args: --timeout=5m

  security-scan:
    name: Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # SCA: scans go.sum for known-vulnerable dependency versions
      - name: SCA - Trivy filesystem scan (dependency vulnerabilities)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: evaluation-service
          severity: CRITICAL
          exit-code: 1
          format: table

      # SAST: scans our own source code for insecure patterns
      - name: SAST - gosec (source code vulnerabilities)
        uses: securego/gosec@master
        with:
          args: '-severity high -confidence high ./...'

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build-test, lint, security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set short commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t ${{ env.SERVICE_NAME }}:${{ steps.vars.outputs.sha_short }} .

      - name: Container scan - Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.SERVICE_NAME }}:${{ steps.vars.outputs.sha_short }}
          severity: CRITICAL
          exit-code: 1
          format: table

